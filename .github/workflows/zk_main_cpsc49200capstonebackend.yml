name: Build and deploy Node.js app to Azure Web App - cpsc49200capstonebackend

on:
  push:
    branches:
      - zk_main
  workflow_dispatch:

env:
  AZURE_WEBAPP_PACKAGE_PATH: backend   # path to your Node/Express app
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
      # Use actions/setup-node@v4 for Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install and build from the backend directory
      - name: Install dependencies and build
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        run: |
          npm install
          npm run build --if-present
          npm test --if-present

      # Upload only the backend folder as the artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38C3DA46F21941A08CD3DC3E7E33223F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9C3A9C8F85CB43DF89DF6DB36975789F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4215DC3EA0D649A9897CB06A3EC04320 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cpsc49200capstonebackend'
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
