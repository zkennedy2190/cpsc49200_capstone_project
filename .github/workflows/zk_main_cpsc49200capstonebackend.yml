# .github/workflows/azure-deploy-backend.yml
# Builds and deploys the Node.js backend to Azure Web App cpsc49200capstonebackend

name: Build and deploy Node.js app to Azure Web App - cpsc49200capstonebackend

on:
  push:
    branches:
      - zk_main             # Adjust if your deployment branch differs
  workflow_dispatch:

# Shared environment variables
env:
  AZURE_WEBAPP_PACKAGE_PATH: backend   # Path to your Express app in the repo
  NODE_VERSION: '20.x'                # Node version to use for the build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Check out the repository
      - uses: actions/checkout@v4

      # Set up Node.js and enable caching based on backend/package-lock.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/package-lock.json

      # Install dependencies and run optional build/tests within the backend directory
      - name: Install dependencies and build backend
        run: |
          cd ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          npm install
          npm run build --if-present
          npm test --if-present

      # Upload the backend folder as the build artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Download the build artifact
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      # Authenticate to Azure using a service principal (values are stored in GitHub secrets)
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38C3DA46F21941A08CD3DC3E7E33223F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9C3A9C8F85CB43DF89DF6DB36975789F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4215DC3EA0D649A9897CB06A3EC04320 }}

      # Deploy the backend package to the Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: cpsc49200capstonebackend
          slot-name: Production
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
